<!-- painel-principal.component.html -->
<div class="container mt-4">
  <h2>Lista de Produtos</h2>
  <table class="table table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Imagem</th>
        <th>Produto</th>
        <th>Descrição</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let produto of produtos">
        <td>{{ produto.id }}</td>
        <td>
          <img [src]="'assets/images/' + produto.foto" [alt]="produto.produto" width="60" height="60" 
               onerror="this.src='assets/images/jogo1.PNG'">
        </td>
        <td>{{ produto.produto }}</td>
        <td>{{ produto.descricao }}</td>
        <td>R$ {{ (produto.preco / 100).toFixed(2).replace('.', ',') }}</td>
        <td>
          <button class="btn btn-primary btn-sm me-2" (click)="editarProduto(produto.id)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="excluirProduto(produto.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
